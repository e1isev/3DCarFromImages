[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "car2asset"
version = "0.1.0"
description = "Convert 4 car photos into realistic and cartoon 3D assets (GLB/FBX)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "e1isev" }]
keywords = ["3d", "car", "ai", "mesh", "glb", "fbx", "hunyuan3d"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "trimesh>=4.0.0",
    "pygltflib>=1.16.0",
    "scipy>=1.11.0",
    "opencv-python>=4.8.0",
    "tqdm>=4.66.0",
    "rich>=13.5.0",
    "typer>=0.9.0",
    "pydantic>=2.3.0",
    "pydantic-settings>=2.0.0",
    "rembg>=2.0.50",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.109.0", "uvicorn[standard]>=0.27.0", "python-multipart>=0.0.9", "aiofiles>=23.2.0"]
ui  = ["streamlit>=1.30.0"]
dev = ["ruff>=0.2.0", "mypy>=1.8.0", "pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
car2asset = "car2asset.run:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
